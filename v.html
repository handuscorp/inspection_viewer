<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검수사진</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#eee; }
  header { padding:14px 16px; font-size:14px; opacity:.75; border-bottom:1px solid #222; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:6px; padding:6px; }
  .grid img { width:100%; height:auto; display:block; background:#222; cursor:zoom-in; border-radius:4px; min-height:140px; }
  .grid img.fail { background:#522; opacity:.4; }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.95); display:none; align-items:center; justify-content:center; z-index:10; padding:12px; }
  #lb.open { display:flex; }
  #lb img { max-width:100%; max-height:100%; border-radius:4px; }
  .empty { padding:40px 20px; opacity:.6; text-align:center; }
</style>
</head>
<body>
<header>검수사진 <span id=count></span></header>
<div class="grid" id="grid"></div>
<div id="lb" onclick="this.classList.remove('open')"><img alt=""></div>
<script>
  // URL 형식 (v5):
  //   1) 컴팩트 모드 (짧은 URL):
  //      ?it=IT0[,IT1...]    ← fragment 없음
  //      → data/{IT}.json 을 가져와 렌더
  //   2) 인라인 모드 (기존 호환):
  //      ?u=u0[,u1..]&f=F&it=IT0[,IT1..]#group0[;group1..]
  //      → fragment의 ID들을 user[i]+it[i] 로 확장

  const BASE = "https://quickstar.co.kr/data/member/";
  const url = new URL(location.href);
  const usersQ   = (url.searchParams.get("u") || "").split(",").map(s => s.trim()).filter(Boolean);
  const folderQ  = url.searchParams.get("f") || "ha";
  const itCodesQ = (url.searchParams.get("it") || "").split(",").map(s => s.trim()).filter(Boolean);
  const rawHash  = decodeURIComponent(location.hash.slice(1));

  const grid  = document.getElementById("grid");
  const count = document.getElementById("count");
  const lb    = document.getElementById("lb");

  const pickAt = (arr, i, fb) => {
    if (arr[i] !== undefined) return arr[i];
    if (arr.length === 1) return arr[0];
    return fb;
  };

  function buildFilename(user, it, id) {
    if (/^\d+$/.test(id) && it) return user + "_" + it + "_" + id + ".jpg";
    return user + "_" + id + ".jpg";
  }

  async function gatherSpecs() {
    const specs = [];

    // 컴팩트 모드: fragment 없고 it 만 있을 때
    if (!rawHash && itCodesQ.length) {
      const datas = await Promise.all(itCodesQ.map(it =>
        fetch("data/" + encodeURIComponent(it) + ".json", { cache: "no-cache" })
          .then(r => r.ok ? r.json() : null)
          .catch(() => null)
      ));
      datas.forEach(data => {
        if (!data) return;
        const f  = data.f  || folderQ;
        const it = data.it || "";
        for (const grp of (data.g || [])) {
          const u = grp.u;
          for (const id of (grp.ids || [])) {
            specs.push({ src: BASE + f + "/" + buildFilename(u, it, id), label: id });
          }
        }
      });
      return specs;
    }

    // 인라인 모드 (기존)
    const users  = usersQ.length ? usersQ : ["handuscorp2"];
    const groups = rawHash ? rawHash.split(";") : [];
    groups.forEach((g, gi) => {
      const u  = pickAt(users, gi, users[0]);
      const it = pickAt(itCodesQ, gi, "");
      g.split(",").map(s => s.trim()).filter(Boolean).forEach(id => {
        specs.push({ src: BASE + folderQ + "/" + buildFilename(u, it, id), label: id });
      });
    });
    return specs;
  }

  function render(specs) {
    if (!specs.length) {
      grid.innerHTML = '<div class="empty">표시할 이미지가 없습니다.</div>';
      return;
    }
    count.textContent = "(총 " + specs.length + "장)";
    for (const s of specs) {
      const img = new Image();
      img.src = s.src;
      img.loading = "lazy";
      img.alt = s.label;
      img.onclick = () => { lb.querySelector("img").src = s.src; lb.classList.add("open"); };
      img.onerror = () => { img.classList.add("fail"); };
      grid.appendChild(img);
    }
  }

  gatherSpecs().then(render).catch(e => {
    console.error(e);
    grid.innerHTML = '<div class="empty">로딩 중 오류가 발생했습니다.</div>';
  });
</script>
</body>
</html>
