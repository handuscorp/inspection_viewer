<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>검수사진</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111; font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif; color:#eee; }
  header { padding:14px 16px; font-size:14px; opacity:.75; border-bottom:1px solid #222; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:6px; padding:6px; }
  .grid img { width:100%; height:auto; display:block; background:#222; cursor:zoom-in; border-radius:4px; }
  #lb { position:fixed; inset:0; background:rgba(0,0,0,.95); display:none; align-items:center; justify-content:center; z-index:10; padding:12px; }
  #lb.open { display:flex; }
  #lb img { max-width:100%; max-height:100%; border-radius:4px; }
  .empty { padding:40px 20px; opacity:.6; text-align:center; }
</style>
</head>
<body>
<header>검수사진 <span id=count></span></header>
<div class="grid" id="grid"></div>
<div id="lb" onclick="this.classList.remove('open')"><img alt=""></div>
<script>
  // 퀵스타 이미지 URL 패턴:
  //   https://quickstar.co.kr/data/member/{folder}/{user}_{ID부분}.jpg
  // fragment 형식: ?u=user&f=folder#id1,id2,...
  //   - u, f 생략 시 기본값(아래 DEFAULT_*) 사용
  const DEFAULT_USER   = "handuscorp2";
  const DEFAULT_FOLDER = "ha";
  const BASE = "https://quickstar.co.kr/data/member/";

  const url   = new URL(location.href);
  const user  = url.searchParams.get("u") || DEFAULT_USER;
  const fold  = url.searchParams.get("f") || DEFAULT_FOLDER;
  const raw   = decodeURIComponent(location.hash.slice(1));
  const ids   = raw ? raw.split(",").map(s => s.trim()).filter(Boolean) : [];

  const grid  = document.getElementById("grid");
  const count = document.getElementById("count");
  const lb    = document.getElementById("lb");

  if (ids.length === 0) {
    grid.innerHTML = '<div class="empty">표시할 이미지가 없습니다.</div>';
  } else {
    count.textContent = "(총 " + ids.length + "장)";
    for (const id of ids) {
      const src = BASE + fold + "/" + user + "_" + id + ".jpg";
      const img = new Image();
      img.src = src;
      img.loading = "lazy";
      img.alt = id;
      img.onclick = () => { lb.querySelector("img").src = src; lb.classList.add("open"); };
      grid.appendChild(img);
    }
  }
</script>
</body>
</html>
